include:
  - artifact: module_input_stream_board_feature_disabled
    board: xiao_ble//zmk
    shield: tester_xiao

  - artifact: module_input_stream_board_with_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_INPUT_STREAM_FEATURE=y -DCONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
    snippet: studio-rpc-usb-uart

  - artifact: module_input_stream_board_without_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_INPUT_STREAM_FEATURE=y

  - artifact: module_input_stream_board_secure_rpc
    board: xiao_ble//zmk
    shield: tester_xiao
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_INPUT_STREAM_FEATURE=y -DCONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y -DCONFIG_ZMK_INPUT_STREAM_SECURE=y -DCONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000 -DCONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
    snippet: studio-rpc-usb-uart
